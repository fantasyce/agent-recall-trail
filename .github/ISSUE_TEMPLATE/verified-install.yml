name: Verified install report
description: Report a real, privacy-safe ART installation outcome in a few minutes
title: "install: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Share whether ART worked in a real host. No credentials, private knowledge, or full transcripts.
  - type: input
    id: version
    attributes:
      label: ART version
      placeholder: 0.3.6
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex
        - DeepSeek Harness
        - Other stdio MCP host
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - Linux amd64
        - Other
    validations:
      required: true
  - type: textarea
    id: operation
    attributes:
      label: Operation attempted
      placeholder: Installed the release archive, connected one stdio child, and ran art_health.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Observed result
      options:
        - Worked as documented
        - Worked with a workaround
        - Did not work
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence or workaround
      description: Include only version, status, error category, and bounded redacted output.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: No credentials, private knowledge, or full transcripts are included.
          required: true
