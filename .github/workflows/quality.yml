name: quality
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    strategy: {fail-fast: false, matrix: {os: [macos-14, ubuntu-24.04]}}
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy && rustup default 1.98.0
      - name: Install verified ripgrep
        run: bash scripts/install_ci_ripgrep.sh "$RUNNER_TEMP/rg-bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --release --locked -p art-cli
      - run: ART_BIN=target/release/art bash tests/scripts/test_release_version.sh && ART_BIN=target/release/art bash tests/scripts/test_plugin_surface.sh && ART_BIN=target/release/art bash tests/scripts/test_install_lifecycle.sh
      - run: bash tests/scripts/test_migration.sh && bash scripts/open_source_check.sh
